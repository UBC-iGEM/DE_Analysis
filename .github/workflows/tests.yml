# Run the repository test suite for proposed and merged changes.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Try the database without third-party packages
        run: |
          python -S -m promoter_discovery.demo --database "$RUNNER_TEMP/demo.sqlite"
          python -S -m promoter_discovery.db_cli --database "$RUNNER_TEMP/demo.sqlite" --json network demo-gene-1

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run tests
        run: python -m pytest -q
