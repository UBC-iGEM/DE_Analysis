<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Promoter explorer</title>
<style>
:root{font-family:system-ui,sans-serif;color:#24283d;background:#f7f7f3;--muted:#606477;--border:#deded8;--purple:#6d61cf;--mint:#cbe6dd}
*{box-sizing:border-box}body{margin:0}header{padding:28px 32px;background:#22253f;color:#f3f2ff}h1{font-size:26px;margin:0 0 8px;font-weight:650}header p{margin:0;color:#cbd0e5;font-size:14px}
main{max-width:1500px;margin:auto;padding:24px}button,input,select{font:inherit}button{cursor:pointer}input,select{border:1px solid var(--border);border-radius:8px;padding:10px;background:white;min-width:0}label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:16px}.primary{background:var(--purple);border:0;border-radius:8px;color:white;padding:11px 20px}.secondary{border:1px solid var(--border);background:white;border-radius:8px;padding:8px 12px;color:#34394e}
.status{font-size:13px;color:var(--muted);margin:14px 0;min-height:20px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px}.card{border:1px solid var(--border);border-radius:12px;background:#fff;padding:22px;margin-bottom:18px}h2{margin:0 0 12px;font-size:21px}h3{font-size:16px;margin:0 0 14px}.muted{color:var(--muted);font-size:13px}.candidate-list{max-height:850px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:white}.candidate{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #eee;background:white;padding:14px 16px;color:#24283d}.candidate:hover,.candidate[aria-current=true]{background:#eef0fc}.candidate strong{display:block}.candidate span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}.tag{display:inline-block;font-size:12px;background:#f1effb;border-radius:5px;padding:5px 8px;margin:0 6px 5px 0}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0;font-size:12px;color:var(--muted)}.legend span:before{content:'';display:inline-block;width:24px;border-top:2px solid #495371;margin-right:6px;vertical-align:middle}.legend .context:before{border-top-style:dashed;border-color:#9ea5b3}.graph{overflow:auto;background:#fafbf9;border-radius:8px;max-height:580px}.graph svg{min-width:760px;display:block;width:100%}.edge-detail{font-size:13px;line-height:1.7;margin-top:12px;color:var(--muted)}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;text-align:left}th,td{padding:10px;border-bottom:1px solid #e9e9e3;vertical-align:top}th{font-weight:600;color:#606477}code{font-family:ui-monospace,monospace}.sequence{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.6;background:#f7f7f3;padding:12px;border-radius:6px}details{margin:12px 0}summary{cursor:pointer;font-size:14px;font-weight:600}.empty{padding:32px;color:var(--muted)}.error{color:#a33030}.hidden{display:none}
@media(max-width:850px){main{padding:16px}header{padding:24px 16px}form{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.candidate-list{max-height:230px}.card{padding:16px}}
</style>
</head>
<body>
<header><h1>Promoter explorer</h1><p>Explore candidate responses, promoters, and curated regulatory relationships.</p></header>
<main>
<form id="search">
<label>Gene or candidate<input name="query" placeholder="Search by name, e.g. pdhR"></label>
<label>Antibiotic class<select name="class"><option value="">All classes</option><option value="beta_lactam">Beta-lactams</option><option value="aminoglycoside">Aminoglycosides</option></select></label>
<label>Maximum adjusted p-value<input name="padj_max" type="number" min="0" max="1" step="any" placeholder="e.g. 0.05"></label>
<label>Minimum |log₂ change|<input name="effect_min" type="number" min="0" step="any" placeholder="e.g. 1"></label>
<button class="primary" type="submit">Search</button>
</form>
<div class="toolbar"><div id="status" class="status" role="status" aria-live="polite">Loading database…</div><button id="panel" class="secondary">View selected panel</button></div>
<div class="layout"><aside><div id="candidates" class="candidate-list" aria-label="Candidates"></div></aside><section id="content"><div class="card empty">Select a candidate to explore its regulatory context.</div></section></div>
</main>
<script>
const $=id=>document.getElementById(id);
let runId=null, selection=0, searchVersion=0, selected=null;
const className=value=>({beta_lactam:'Beta-lactam',aminoglycoside:'Aminoglycoside'}[value]||value||'—');
const number=value=>value==null?'—':Number(value).toPrecision(3);
function el(tag,text,cls){const n=document.createElement(tag);if(text!=null)n.textContent=text;if(cls)n.className=cls;return n;}
async function api(path,params={}){const query=new URLSearchParams({...params,...(runId?{run_id:runId}:{})});const r=await fetch(path+'?'+query);const data=await r.json();if(!r.ok)throw new Error(data.error||'Request failed');return data;}
function fail(error){$('status').textContent=error.message;$('status').classList.add('error');}
function table(headers,rows){const wrap=el('div',null,'scroll'),t=el('table'),head=el('thead'),tr=el('tr');headers.forEach(h=>tr.append(el('th',h)));head.append(tr);t.append(head);const b=el('tbody');rows.forEach(row=>{const tr=el('tr');row.forEach(v=>tr.append(el('td',v??'—')));b.append(tr);});t.append(b);wrap.append(t);return wrap;}
function list(rows){$('candidates').replaceChildren();if(!rows.length){$('candidates').append(el('div','No matching candidates.','empty'));return;}rows.forEach(row=>{const b=el('button',null,'candidate');b.dataset.id=row.candidate_id;b.setAttribute('aria-current',String(row.candidate_id===selected));b.append(el('strong',row.candidate_id),el('span',className(row.antibiotic_class)),el('span',(row.support_tier||row.selection_rationale||'').replaceAll('_',' ')));b.onclick=()=>loadCandidate(row.candidate_id);$('candidates').append(b);});}
async function search(){const version=++searchVersion;try{const params={};for(const [key,value] of new FormData($('search')))if(value)params[key]=value;const rows=await api('/api/candidates',params);if(version!==searchVersion)return;list(rows);$('status').classList.remove('error');$('status').textContent=rows.length+' matching candidates · discovery comparisons';}catch(e){if(version===searchVersion)fail(e);}}
$('search').onsubmit=e=>{e.preventDefault();search();};
$('panel').onclick=async()=>{const version=++searchVersion;try{const rows=await api('/api/panel');if(version!==searchVersion)return;list(rows);$('status').textContent=rows.length+' proposed panel members';}catch(e){fail(e);}};
async function loadCandidate(id){const version=++selection;selected=id;document.querySelectorAll('.candidate').forEach(b=>b.setAttribute('aria-current',String(b.dataset.id===id)));$('content').replaceChildren(el('div','Loading candidate…','card empty'));try{const [c,graph]=await Promise.all([api('/api/candidate/'+encodeURIComponent(id)),api('/api/network/'+encodeURIComponent(id))]);if(version!==selection)return;renderCandidate(c,graph);}catch(e){if(version===selection){$('content').replaceChildren(el('div',e.message,'card error'));fail(e);}}}
function renderCandidate(c,graph){const content=$('content');content.replaceChildren();const intro=el('div',null,'card');intro.append(el('h2',c.canonical_name||c.candidate_id));[className(c.antibiotic_class),(c.support_tier||'').replaceAll('_',' '),c.review_status?'Review: '+c.review_status:'Awaiting review'].forEach(t=>intro.append(el('span',t,'tag')));intro.append(el('p',c.promoters.length+' promoters · '+c.transcription_units.length+' transcription units','muted'));content.append(intro);
const network=el('div',null,'card');network.append(el('h3','Regulatory context'));const legend=el('div',null,'legend');legend.append(el('span','Curated regulation'),el('span','Annotated membership','context'));network.append(legend);const graphBox=el('div',null,'graph'),info=el('div','Select a solid edge to inspect its evidence.','edge-detail');network.append(graphBox,info);content.append(network);drawGraph(graph,graphBox,info);
const responses=el('div',null,'card');responses.append(el('h3','Measured responses'),el('p','Public-dataset compounds are proxies and cross-reactivity challenges.','muted'));responses.append(table(['Comparison','Role','log₂ change','Adjusted p-value'],c.evidence.map(e=>[e.contrast_id.replace(c.run_id+':',''),e.evidence_role,number(e.effect),number(e.padj)])));content.append(responses);
const promoters=el('div',null,'card');promoters.append(el('h3','Promoters & sequences'));if(!c.promoters.length)promoters.append(el('p','No promoter mapping available.','muted'));c.promoters.forEach(p=>{const detail=el('details'),summary=el('summary',(p.name||p.promoter_id)+' · '+p.promoter_id);detail.append(summary,el('p','TSS: '+(p.tss??'unknown')+' · Strand: '+(p.strand??'unknown')+' · Sigma: '+(p.sigma_factor||'unknown'),'muted'),el('p',p.sequence||'No annotated sequence available.','sequence'));detail.addEventListener('toggle',async()=>{if(!detail.open||detail.dataset.loaded)return;try{const review=await api('/api/promoter/'+encodeURIComponent(p.promoter_id));detail.dataset.loaded='true';detail.append(el('p',review.review?'Manual review: '+review.review.review_status:'No manual review yet.','muted'));if(review.fragments.length)detail.append(table(['Fragment','Coordinates','Sequence match','Status'],review.fragments.map(f=>[f.fragment_id,(f.start??'?')+'–'+(f.end??'?'),f.sequence_match===1?'Matches':f.sequence_match===0?'Mismatch':'Unknown',f.review_status])));else detail.append(el('p','No proposed construct fragment.','muted'));}catch(e){detail.append(el('p',e.message,'error'));}});promoters.append(detail);});content.append(promoters);
}
function drawGraph(graph,box,info){const NS='http://www.w3.org/2000/svg',groups=['actor','promoter','tu','gene'],labels=['Regulators','Promoters','Transcription units','Candidate gene'],colors=['#e4dff6','#cbe6dd','#fff0c8','#dde7fc'];const columns=groups.map(kind=>graph.nodes.filter(n=>n.kind===kind));const height=Math.max(220,...columns.map(col=>col.length*70+90));const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 940 '+height);svg.setAttribute('role','img');svg.setAttribute('aria-label','Candidate regulatory network');box.append(svg);function s(tag,attributes={},text){const n=document.createElementNS(NS,tag);Object.entries(attributes).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;return n;}
const defs=s('defs');[['arrow','M0,0 L8,4 L0,8 Z'],['bar','M5,0 L5,8']].forEach(([id,d])=>{const marker=s('marker',{id,viewBox:'0 0 8 8',refX:7,refY:4,markerWidth:8,markerHeight:8,orient:'auto'});marker.append(s('path',{d,fill:id==='bar'?'none':'#495371',stroke:'#495371','stroke-width':1.5}));defs.append(marker);});svg.append(defs);const pos={};columns.forEach((col,i)=>{svg.append(s('text',{x:28+i*235,y:28,fill:'#606477','font-size':12},labels[i]));col.forEach((n,j)=>pos[n.id]={x:28+i*235,y:55+j*70});});
graph.edges.forEach((e,index)=>{const a=pos[e.source],b=pos[e.target];if(!a||!b)return;const x1=a.x+168,y1=a.y+19,x2=b.x,y2=b.y+19;const direct=e.kind==='regulation',curve=(index%5-2)*5;const line=s('path',{d:`M${x1},${y1} C${x1+55},${y1+curve} ${x2-55},${y2+curve} ${x2},${y2}`,fill:'none',stroke:direct?'#495371':'#a4a9b5','stroke-width':direct?2:1.5,...(direct?{'marker-end':e.effect==='repressor'?'url(#bar)':'url(#arrow)'}:{'stroke-dasharray':'5 5'})});line.append(s('title',{},direct?[e.effect,e.confidence,e.evidence].filter(Boolean).join(' · '):e.label));if(direct){line.style.cursor='pointer';line.onclick=()=>{info.replaceChildren();[['Effect',e.effect],['Target type',e.target_kind],['Confidence',e.confidence],['Conformation',e.conformation],['Interaction evidence',e.evidence],['Binding-site evidence',e.site_evidence],['Binding site',e.site_id],['Publication IDs',e.pmids],['Reference release',e.source_release]].forEach(([label,value])=>{const p=el('div');p.append(el('strong',label+': '),document.createTextNode(value||'Unspecified'));info.append(p);});};}svg.append(line);});
columns.forEach((col,i)=>col.forEach(n=>{const p=pos[n.id],g=s('g');g.append(s('rect',{x:p.x,y:p.y,width:168,height:38,rx:8,fill:colors[i],stroke:'#d4d7dd'}),s('text',{x:p.x+10,y:p.y+24,'font-size':12,fill:'#24283d'},n.label.length>21?n.label.slice(0,20)+'…':n.label),s('title',{},n.entity_id));svg.append(g);}));if(!graph.edges.length)info.textContent='No curated regulatory interactions are linked to this candidate.';
}
async function init(){try{const runs=await api('/api/runs');const latest=runs.find(r=>r.status==='complete');if(!latest)throw new Error('No completed analysis run available.');runId=latest.run_id;const coverage=await api('/api/coverage');document.querySelector('header p').textContent='RegulonDB '+latest.reference_release+' · '+(coverage.regulatory_interactions??'—')+' curated interactions · '+(coverage.interactions_without_promoter??'—')+' without a promoter link';await search();}catch(e){fail(e);}}
init();
</script>
</body>
</html>
